<!doctype html>

<meta charset="utf-8">

<title>Гобелен пути</title>
<meta name="description" content="Мягкий планер жизни в виде путешествия: цели, привычки, деньги и настроение — без упрёков за пропуски.">
<meta name="theme-color" content="#1F1611">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Гобелен">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="icon" type="image/png" href="img/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="fonts/gatchina-regular.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="fonts/brahms-gotisch.otf" as="font" type="font/otf" crossorigin>
<link rel="stylesheet" href="css/app.css?v=a3cfca2618">
</head>
<body>
<div id="app"></div>
<noscript>Для гобелена нужен JavaScript.</noscript>
<script type="module" src="js/app.js?v=a3cfca2618"></script>
<script>
  // Обновления приходят сами: новая версия скачивается в фоне и включается без потери записей.
  if ('serviceWorker' in navigator) {
    const had = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (had) location.reload(); });
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').then((r) => r.update()).catch(() => {}));
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') navigator.serviceWorker.getRegistration().then((r) => r && r.update()).catch(() => {}); });
  }
</script>
</body>
</html>
